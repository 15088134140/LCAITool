version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: lcaitool_postgres
    environment:
      POSTGRES_DB: lcaitool
      POSTGRES_USER: lcaitool
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lcaitool -d lcaitool"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lcaitool_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lcaitool_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lcaitool.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    profiles: ["devtools"]

volumes:
  postgres_data:
  redis_data:
