version: "3.8"

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: lcaitool-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lcaitool}
      POSTGRES_USER: ${POSTGRES_USER:-lcaitool}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lcaitool-network
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lcaitool} -d ${POSTGRES_DB:-lcaitool}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis Cache / Message Broker
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: lcaitool-redis
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./infra/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - lcaitool-network
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend API (FastAPI)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: ./infra/docker/backend/Dockerfile
    container_name: lcaitool-backend
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lcaitool}:${DB_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-lcaitool}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-this-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      BACKEND_CORS_ORIGINS: '["http://localhost","http://localhost:3000","http://localhost:3001"]'
      API_V1_STR: /api/v1
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - uploads_data:/app/uploads
      - storage_data:/app/storage
      - logs_data:/app/logs
    networks:
      - lcaitool-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; response = httpx.get('http://localhost:8000/api/v1/health'); assert response.status_code == 200"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ============================================
  # Celery Worker
  # ============================================
  worker:
    build:
      context: .
      dockerfile: ./infra/docker/backend/Dockerfile
    container_name: lcaitool-worker
    command: ["celery", "-A", "worker", "worker", "--loglevel=info"]
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lcaitool}:${DB_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-lcaitool}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads_data:/app/uploads
      - storage_data:/app/storage
      - logs_data:/app/logs
    networks:
      - lcaitool-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ============================================
  # Frontend User (Next.js) - 根路径
  # ============================================
  frontend-user:
    build:
      context: .
      dockerfile: ./infra/docker/frontend-user/Dockerfile
    container_name: lcaitool-frontend-user
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
    networks:
      - lcaitool-network
    depends_on:
      - backend
    restart: unless-stopped

  # ============================================
  # Frontend Admin (React + Vite) - /admin/ 路径
  # ============================================
  frontend-admin:
    build:
      context: .
      dockerfile: ./infra/docker/frontend-admin/Dockerfile
    container_name: lcaitool-frontend-admin
    environment:
      TZ: Asia/Shanghai
    networks:
      - lcaitool-network
    depends_on:
      - backend
    restart: unless-stopped

  # ============================================
  # Nginx Gateway (统一入口)
  # ============================================
  gateway:
    image: nginx:alpine
    container_name: lcaitool-gateway
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./infra/docker/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/docker/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - lcaitool-network
    depends_on:
      - backend
      - frontend-user
      - frontend-admin
    restart: unless-stopped

  # ============================================
  # pgAdmin (Database Manager) - devtools profile
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lcaitool-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@lcaitool.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      TZ: Asia/Shanghai
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - lcaitool-network
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - devtools
    restart: unless-stopped

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  storage_data:
    driver: local
  logs_data:
    driver: local
  pgadmin_data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  lcaitool-network:
    driver: bridge
