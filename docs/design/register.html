<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 灵创AI工具箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'DM Sans', system-ui, -apple-system, sans-serif; }
        .float-animation { animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
    </style>
</head>
<body class="text-white antialiased min-h-screen bg-gradient-to-br from-[#0F172A] via-[#1E3A5F] to-[#2563EB]">

    <!-- Navigation -->
    <nav class="relative z-20 border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="index.html" class="flex items-center gap-2">
                    <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-blue-400/60 to-cyan-400/60 border border-white/20 flex items-center justify-center">
                        <span class="text-white font-bold text-lg">AI</span>
                    </div>
                    <span class="font-bold text-xl text-white">灵创AI</span>
                </a>
                <div>
                    <a href="login.html" class="text-blue-200 font-medium hover:text-white transition-colors focus:outline-none">已有账号？去登录</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="min-h-[calc(100vh-64px)] relative overflow-hidden">
        <!-- Global Background Glow Effects -->
        <div class="absolute -top-20 -left-20 w-[600px] h-[600px] bg-blue-500/20 rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 right-0 w-[500px] h-[500px] bg-cyan-500/15 rounded-full blur-3xl"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-blue-400/5 rounded-full blur-3xl"></div>

        <!-- Subtle Grid Pattern -->
        <div class="absolute inset-0 opacity-[0.02]">
            <svg width="100%" height="100%">
                <defs>
                    <pattern id="grid-bg" width="50" height="50" patternUnits="userSpaceOnUse">
                        <path d="M 50 0 L 0 0 0 50" fill="none" stroke="white" stroke-width="1"/>
                    </pattern>
                </defs>
                <rect width="100%" height="100%" fill="url(#grid-bg)"/>
            </svg>
        </div>

        <!-- Floating Orbs -->
        <div class="absolute top-40 left-1/4 w-4 h-4 bg-cyan-400/40 rounded-full float-animation shadow-lg shadow-cyan-400/30"></div>
        <div class="absolute top-60 right-1/3 w-3 h-3 bg-blue-400/40 rounded-full float-animation" style="animation-delay: 1s;"></div>
        <div class="absolute bottom-40 left-1/3 w-5 h-5 bg-white/20 rounded-full float-animation" style="animation-delay: 1.5s;"></div>
        <div class="absolute top-1/3 right-1/4 w-2 h-2 bg-cyan-300/30 rounded-full float-animation" style="animation-delay: 0.5s;"></div>

        <div class="relative z-10 flex min-h-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <!-- Left Panel - Benefits Section (Desktop Only) -->
            <div class="hidden lg:flex lg:w-1/2 relative">
                <!-- Content -->
                <div class="flex flex-col justify-center pr-8 py-20 w-full">
                    <!-- Headline -->
                    <div class="mb-10">
                        <h1 class="text-4xl font-bold text-white mb-4 leading-tight">
                            开启您的<br/>
                            <span class="bg-gradient-to-r from-blue-300 via-cyan-300 to-blue-200 bg-clip-text text-transparent">
                                AI创作之旅
                            </span>
                        </h1>
                        <p class="text-blue-200/70 text-lg max-w-sm leading-relaxed">
                            注册即送多重好礼，零成本体验专业AI工具，让创意不再受限
                        </p>
                    </div>

                    <!-- Benefit Cards -->
                    <div class="space-y-4 mb-10">
                        <div class="bg-white/5 backdrop-blur-sm border border-white/10 rounded-xl p-5 hover:bg-white/10 transition-all duration-300">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-400/40 to-blue-600/40 flex items-center justify-center">
                                    <svg class="w-6 h-6 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                </div>
                                <div>
                                    <h3 class="font-bold text-white">新用户注册礼包</h3>
                                    <p class="text-blue-300 font-semibold text-lg">50 积分免费送</p>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white/5 backdrop-blur-sm border border-white/10 rounded-xl p-5 hover:bg-white/10 transition-all duration-300">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-green-400/40 to-emerald-600/40 flex items-center justify-center">
                                    <svg class="w-6 h-6 text-green-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                                    </svg>
                                </div>
                                <div>
                                    <h3 class="font-bold text-white">实名认证奖励</h3>
                                    <p class="text-green-300 font-semibold text-lg">额外 +20 积分</p>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white/5 backdrop-blur-sm border border-white/10 rounded-xl p-5 hover:bg-white/10 transition-all duration-300">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-amber-400/40 to-orange-500/40 flex items-center justify-center">
                                    <svg class="w-6 h-6 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                                    </svg>
                                </div>
                                <div>
                                    <h3 class="font-bold text-white">专属新手特权</h3>
                                    <p class="text-amber-300 font-semibold text-lg">首单工具 5 折</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Trust Indicators -->
                    <div class="pt-8 border-t border-white/10">
                        <div class="grid grid-cols-3 gap-4 text-center">
                            <div>
                                <div class="text-2xl font-bold text-white">50,000+</div>
                                <div class="text-sm text-blue-200/50">注册用户</div>
                            </div>
                            <div>
                                <div class="text-2xl font-bold text-white">4.9</div>
                                <div class="text-sm text-blue-200/50">用户评分</div>
                            </div>
                            <div>
                                <div class="text-2xl font-bold text-white">99.9%</div>
                                <div class="text-sm text-blue-200/50">服务可用性</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel - Register Form -->
            <div class="w-full lg:w-1/2 flex items-center justify-center pl-0 lg:pl-8 py-12">
                <div class="w-full max-w-md">
                    <!-- Mobile Header -->
                    <div class="lg:hidden text-center mb-8">
                        <h1 class="text-2xl font-bold text-white mb-2">开启您的AI创作之旅</h1>
                        <p class="text-blue-200/70">注册即送多重好礼</p>
                    </div>

                    <!-- Glassmorphism Register Card -->
                    <div class="bg-white/8 backdrop-blur-2xl rounded-2xl border border-white/15 p-8 shadow-2xl shadow-black/10">
                        <!-- Desktop Header -->
                        <div class="hidden lg:block mb-8">
                            <h2 class="text-2xl font-bold text-white mb-2">创建账号</h2>
                            <p class="text-blue-200/60">只需30秒，开启AI创作</p>
                        </div>

                        <form class="space-y-5">
                            <div>
                                <label class="block text-sm font-medium text-white/90 mb-2">手机号码</label>
                                <input type="tel" placeholder="请输入手机号码" class="w-full h-12 px-4 rounded-xl text-white placeholder-blue-200/60 bg-white/8 border border-white/15 focus:border-blue-400/50 focus:ring-2 focus:ring-blue-400/20 focus:outline-none transition-all duration-200">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-white/90 mb-2">验证码</label>
                                <div class="flex gap-3">
                                    <div class="flex-1">
                                        <input type="text" placeholder="请输入验证码" class="w-full h-12 px-4 rounded-xl text-white placeholder-blue-200/60 bg-white/8 border border-white/15 focus:border-blue-400/50 focus:ring-2 focus:ring-blue-400/20 focus:outline-none transition-all duration-200">
                                    </div>
                                    <button type="button" class="shrink-0 w-28 h-12 px-3 rounded-xl font-medium text-sm bg-white/10 border border-white/15 text-blue-200 hover:bg-white/15 hover:text-white transition-all duration-200 focus:outline-none">
                                        获取验证码
                                    </button>
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-white/90 mb-2">设置密码</label>
                                <div class="relative">
                                    <input type="password" placeholder="6-20位字母、数字或符号" class="w-full h-12 px-4 rounded-xl text-white placeholder-blue-200/60 bg-white/8 border border-white/15 focus:border-blue-400/50 focus:ring-2 focus:ring-blue-400/20 focus:outline-none transition-all duration-200 pr-12">
                                    <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-white/40 hover:text-white/70 focus:outline-none transition-colors">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                        </svg>
                                    </button>
                                </div>
                                <p class="mt-2 text-xs text-blue-200/40">密码长度6-20位，包含字母和数字</p>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-white/90 mb-2">确认密码</label>
                                <input type="password" placeholder="请再次输入密码" class="w-full h-12 px-4 rounded-xl text-white placeholder-blue-200/60 bg-white/8 border border-white/15 focus:border-blue-400/50 focus:ring-2 focus:ring-blue-400/20 focus:outline-none transition-all duration-200">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-white/90 mb-2">昵称（选填）</label>
                                <input type="text" placeholder="给自己起个好听的名字" class="w-full h-12 px-4 rounded-xl text-white placeholder-blue-200/60 bg-white/8 border border-white/15 focus:border-blue-400/50 focus:ring-2 focus:ring-blue-400/20 focus:outline-none transition-all duration-200">
                            </div>

                            <label class="flex items-start gap-3 cursor-pointer">
                                <input type="checkbox" class="w-4 h-4 mt-0.5 rounded border-white/20 bg-white/8 text-blue-400 focus:ring-blue-400/30 focus:ring-offset-0 focus:outline-none">
                                <span class="text-sm text-blue-200/50">
                                    我已阅读并同意
                                    <a href="#" class="text-blue-300 hover:text-blue-200 hover:underline">《用户协议》</a>
                                    和
                                    <a href="#" class="text-blue-300 hover:text-blue-200 hover:underline">《隐私政策》</a>
                                </span>
                            </label>

                            <button type="submit" class="w-full py-3 px-6 text-white font-semibold rounded-xl bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-400 hover:to-cyan-400 shadow-lg shadow-blue-500/25 hover:shadow-blue-400/30 transition-all duration-200 focus:ring-2 focus:ring-blue-400/30 focus:outline-none">
                                立即注册
                            </button>
                        </form>

                        <!-- Mobile Benefits -->
                        <div class="lg:hidden mt-6 pt-6 border-t border-white/10">
                            <div class="flex items-center justify-around text-center">
                                <div>
                                    <div class="text-lg font-bold text-blue-300">50积分</div>
                                    <div class="text-xs text-blue-200/50">注册即送</div>
                                </div>
                                <div>
                                    <div class="text-lg font-bold text-green-300">+20积分</div>
                                    <div class="text-xs text-blue-200/50">认证奖励</div>
                                </div>
                                <div>
                                    <div class="text-lg font-bold text-amber-300">5折</div>
                                    <div class="text-xs text-blue-200/50">首单特惠</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer (Mobile Only) -->
    <footer class="relative z-10 border-t border-white/10 py-6 lg:hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center">
                <p class="text-blue-200/40 text-sm">© 2024 灵创AI工具箱. 保留所有权利。</p>
            </div>
        </div>
    </footer>

</body>
</html>
