# Docker 内置 DNS 服务器，每 30s 重新解析 upstream 主机名
# 这样重建前端容器后 IP 变化时，网关能自动感知，无需手动重启
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name localhost;

    # 动态解析的 upstream 地址（用变量才会触发运行时 DNS 解析）
    # 直接写 proxy_pass http://backend 只在启动时解析一次，容器重建后会 502
    set $upstream_backend "backend:8000";
    set $upstream_admin "frontend-admin:80";
    set $upstream_user "frontend-user:3000";

    # 上传文件大小限制
    client_max_body_size 100m;

    # ============================================
    # API 代理 -> Backend (:8000)
    # 请求 /api/v1/xxx -> backend:8000/api/v1/xxx
    # ============================================
    location /api/ {
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # 静态资源代理 -> Backend (:8000)
    # ============================================
    location /static/ {
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # 管理后台 (React SPA) 代理 -> frontend-admin (:80)
    # 请求 /admin/xxx -> frontend-admin:80/admin/xxx
    # ============================================
    location /admin/ {
        proxy_pass http://$upstream_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # 用户端 (Next.js) 代理 -> frontend-user (:3000)
    # ============================================
    location / {
        proxy_pass http://$upstream_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # 安全头
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
